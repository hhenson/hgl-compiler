# Each key completes the hgraph emitter's diagnostic "the hgraph target
# does not write ... yet". A case is allowed only for the listed reason.

# Rejection cases the compiler does not yet reject, each
# `suite::file::declaration` with the file under the suite's directory,
# under a reason that names the missing rule. A listed case must fail by
# not being rejected: one that is rejected fails the check.
[rejections]
"instances of one declaration that never end when the program is compiled, past the implementation's bound (GEN-13)" = [
    "conformance::rejections/generic_instances.hgl::climbed",
]
