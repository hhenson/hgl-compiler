# The cases of core's suites the cpp target does not run yet: how its
# progress is counted (docs/cpp-target.md, "Progress and acceptance").
# Each key completes the cpp emitter's diagnostic "the cpp target does not
# write ... yet", and lists the cases not run for that form; a case is
# allowed only for the listed reason, and one that runs fails the check
# until it is taken off. `check_core.py --target cpp --write-list` writes
# the list from a run; read the difference before it is committed.

"a child of a connection" = [
    "conformance::switching_keys_follows_the_new_child",
]
"a designation of a position of a list" = [
    "conformance::a_ref_result_follows_the_element_it_designates",
]
"a nullable value put in the run's store (hgl_spec issue 165)" = [
    "conformance::a_stored_null_is_distinct_from_an_absent_key",
]

# Rejection cases the compiler does not yet reject, as in the hgraph
# target's list: none.
[rejections]
