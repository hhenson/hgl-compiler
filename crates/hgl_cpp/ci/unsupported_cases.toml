# The cases of core's suites the cpp target does not run yet: how its
# progress is counted (docs/cpp-target.md, "Progress and acceptance").
# Each key completes the cpp emitter's diagnostic "the cpp target does not
# write ... yet", and lists the cases not run for that form; a case is
# allowed only for the listed reason, and one that runs fails the check
# until it is taken off. `check_core.py --target cpp --write-list` writes
# the list from a run; read the difference before it is committed.

"a designation of a position of a list" = [
    "conformance::a_ref_result_follows_the_element_it_designates",
]
"a field of a connection" = [
    "conformance::an_atomic_quote_wakes_its_bid_projection",
    "conformance::changing_a_sibling_field_does_not_publish_a_bid",
]
"a run's configuration that is no `RunConfig(...)`" = [
    "conformance::absolute_targets_before_at_and_after_start",
    "conformance::skipped_targets_still_establish_source_order",
]
"a temporal value of `MarketQuote`" = [
    "conformance::a_struct_is_all_valid_once_every_field_is",
    "conformance::a_struct_is_valid_once_one_field_is",
    "conformance::a_whole_struct_is_a_trace_cell",
]
"a temporal value of `NotedQuote`" = [
    "conformance::a_struct_with_an_optional_field_is_all_valid_and_read_whole",
]
"a temporal value of `dict<str, i64>`" = [
    "conformance::a_whole_dictionary_is_a_trace_cell",
    "conformance::an_empty_dictionary_given_to_an_empty_dictionary_is_no_tick",
    "conformance::removing_only_an_absent_key_is_no_tick",
]
"a temporal value of `i64?`" = [
    "conformance::a_published_null_has_a_delta",
    "conformance::a_removed_key_is_absent_until_added_again",
    "conformance::a_retained_list_is_independent_of_later_input_changes",
    "conformance::a_stored_null_is_distinct_from_an_absent_key",
    "conformance::lifted_nullable_binds_null_on_a_trigger",
    "conformance::lifting_observes_the_complete_list_including_empty",
    "conformance::publication_establishes_validity",
    "conformance::published_null_takes_precedence_over_a_default",
    "conformance::removing_an_absent_key_is_ignored",
    "conformance::switching_keys_follows_the_new_child",
    "core_implementation::a_null_publication_has_a_tuple_in_the_recording",
    "core_implementation::identity_arithmetic_invalidates_and_recovers",
    "core_implementation::identity_arithmetic_publications",
    "core_implementation::repeated_invalidation_is_silent",
    "core_implementation::unconfigured_arithmetic_uses_lifting",
]
"a temporal value of `set<i64>`" = [
    "conformance::a_set_delta_changes_only_the_named_members",
    "conformance::a_set_given_the_members_it_holds_is_no_tick",
    "conformance::a_whole_set_replaces_the_previous_members",
    "conformance::an_empty_set_delta_ticks_only_where_it_makes_the_set_valid",
    "conformance::mixed_replay",
    "conformance::removing_only_an_absent_member_is_no_tick",
    "core_implementation::record_can_be_empty",
]
"a trace of `MarketQuote`" = [
    "conformance::a_struct_delta_keeps_the_final_write_to_each_field",
]
"a trace of `datetime?`" = [
    "conformance::last_modified_follows_the_last_publication",
    "conformance::propagating_a_retained_error_preserves_its_origin",
]
"a trace of `i64?`" = [
    "conformance::an_empty_dictionary_delta_ticks_only_where_it_makes_the_dictionary_valid",
    "conformance::an_ordered_reader_sees_the_latest_store_write",
]
"a trace of `set<i64>`" = [
    "conformance::set_writes_coalesce",
    "core_implementation::record_retains_each_delta",
]

# Rejection cases the compiler does not yet reject, as in the hgraph
# target's list: none.
[rejections]
