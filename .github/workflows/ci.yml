name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# For every cargo command below. They change how long a build takes, not
# what is built or what the tests check.
env:
  # Coloured cargo output in the logs.
  CARGO_TERM_COLOR: always
  # Incremental compilation pays off when a build is repeated after small
  # edits; a CI job builds once.
  CARGO_INCREMENTAL: 0
  # No debug information in unoptimised builds (the test profile inherits
  # this): less to write, link and cache. A failing test still names its
  # file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # `hgl` is built with core's module from the pinned hgl_core
      # submodule, so the build needs the submodules too.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # rust-toolchain.toml selects the compiler; rustup installs it on the
      # first cargo command.
      - run: cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # Source files come from all three platforms, so the tests run on all
    # three. Git on the Windows runner checks text files out with CRLF.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The corpus test reads HGL from the pinned specification submodules.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Installs the pinned toolchain and keeps its version for the cache
      # key: a build by another compiler is of no use.
      - id: rust
        shell: bash
        run: |
          cargo --version
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      # The downloaded crates and the built dependencies a run on main
      # saved for this system, toolchain and Cargo.lock. With them a run
      # compiles only the workspace's own crates.
      - id: cache
        uses: actions/cache/restore@v6
        with:
          # `&cache-paths` names this list; the save step below reuses it
          # as `*cache-paths`, so the two cannot drift apart.
          path: &cache-paths |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      # The dependencies are built with optimisation, which makes the
      # tests about 2.5 times quicker. The workspace's own crates stay
      # unoptimised, as the stack-size tests assume, and debug assertions
      # and overflow checks stay on in all of them.
      - run: cargo test --workspace --locked --config "profile.dev.package.'*'.opt-level=3"
      # The next two steps run only on main, and only when the cache has
      # no entry for this key yet. Pull requests restore what main saved
      # and save nothing, so the repository's 10 GB of cache holds one
      # entry for each system and Cargo.lock in use.
      #
      # Leaves the workspace's own crates out of the cache: every run
      # rebuilds them.
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      # Saves the downloaded crates and the built dependencies.
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}

  hgraph:
    # The tests that run a generated program on hgraph, which the jobs
    # above leave out, and both test suites of the pinned core. hgraph
    # has a wheel for Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The hgraph the target is written against (docs/architecture.md).
      - run: python -m pip install hgraph==0.9.8
      - run: echo "HGL_HGRAPH_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - run: cargo --version
      - run: cargo test -p hgl_hgraph -p hgl_cli --locked -- --ignored
      - run: python -m unittest discover -s crates/hgl_hgraph/ci
      - run: cargo build --locked --bin hgl
      - run: python crates/hgl_hgraph/ci/check_core.py target/debug/hgl spec/hgl_core

  cpp:
    # libhglrt, the C++ target's runtime library (runtime/cpp), built
    # against hgraph's C++ SDK and its unit tests run, then all of it again
    # under the address and undefined-behaviour sanitizers
    # (docs/architecture.md, "The C++ runtime library"). Ubuntu 26.04's
    # image has GCC 15, which the SDK needs.
    runs-on: ubuntu-26.04
    env:
      # The hgraph release the SDK is built from.
      HGRAPH_TAG: "0.9.12"
      # The image's GCC 15, for the SDK and for the library.
      CXX: g++-15
      # The dependency prefix and the SDK, which the steps below make or
      # restore, at paths that are the same in every run: a conda prefix
      # holds its own path, and the SDK holds the prefix's.
      HGL_HGRAPH_DEPS: ${{ github.workspace }}/.hgraph/deps
      HGL_HGRAPH_SDK: ${{ github.workspace }}/.hgraph/sdk
    steps:
      - uses: actions/checkout@v7
        # `hgl`, which the C++ target's steps below build, is built with
        # core's module from the pinned hgl_core submodule.
        with:
          submodules: recursive
      # What the two are made from: the tag, the script, which names every
      # package of the prefix and how the SDK is configured, and the image
      # they are built on.
      - id: key
        shell: bash
        run: echo "key=hgraph-sdk-$ImageOS-$RUNNER_ARCH-$HGRAPH_TAG-${{ hashFiles('scripts/provision-hgraph-sdk.sh') }}" >> "$GITHUB_OUTPUT"
      # A run with this key restores both and builds neither. A run that
      # builds them saves them, from a pull request too: the key changes
      # only with the tag, the script or the image, and a pull request that
      # changes the script then builds them once and not on each push.
      - id: cache
        uses: actions/cache@v6
        with:
          path: |
            .hgraph/deps
            .hgraph/sdk
          key: ${{ steps.key.outputs.key }}
      # micromamba makes the dependency prefix from conda-forge: hgraph's
      # dependencies, with CMake and Ninja, as hgraph's own CI has them.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.10.0-0"
      - if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/provision-hgraph-sdk.sh "$HGRAPH_TAG" "$HGL_HGRAPH_SDK"
      # The prefix's CMake and Ninja for what follows.
      - run: echo "$HGL_HGRAPH_DEPS/bin" >> "$GITHUB_PATH"
      - run: cmake -S runtime/cpp -B build/cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure
      - run: cmake -S runtime/cpp -B build/cpp-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DHGLRT_SANITIZE=ON
      - run: cmake --build build/cpp-sanitize
      - run: ctest --test-dir build/cpp-sanitize --output-on-failure
      # The C++ target on the SDK: the tests that build and run what it
      # writes, and core's cases, held to the list of those it does not
      # run yet (crates/hgl_cpp/ci/unsupported_cases.toml).
      - run: cargo --version
      - run: cargo test -p hgl_cli --locked --test cpp -- --ignored
      - run: cargo build --locked --bin hgl
      - run: python3 crates/hgl_hgraph/ci/check_core.py target/debug/hgl spec/hgl_core --target cpp
