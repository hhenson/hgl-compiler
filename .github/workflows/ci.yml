name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request's branch cancels the run of the one
# before it, which no one waits on any more. A push to main is never
# cancelled: each run there checks a commit of main and saves the
# caches pull requests restore, so its group is its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

# For every cargo command below. They change how long a build takes, not
# what is built or what the tests check.
env:
  # Coloured cargo output in the logs.
  CARGO_TERM_COLOR: always
  # Incremental compilation pays off when a build is repeated after small
  # edits; a CI job builds once.
  CARGO_INCREMENTAL: 0
  # No debug information in unoptimised builds (the test profile inherits
  # this): less to write, link and cache. A failing test still names its
  # file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # `hgl` is built with core's module from the pinned hgl_core
      # submodule, so the build needs the submodules too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # rust-toolchain.toml selects the compiler; rustup installs it on the
      # first cargo command.
      - run: cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # Source files come from all three platforms, so the tests run on all
    # three. Git on the Windows runner checks text files out with CRLF.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The corpus test reads HGL from the pinned specification submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # The Linux browser check compares the PR merge with its base.
          fetch-depth: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && 2 || 1 }}
      # Installs the pinned toolchain and keeps its version for the cache
      # key: a build by another compiler is of no use. Keeps a hash of
      # Cargo.lock without the versions of the workspace's own crates
      # (`hgl_*`), which every release changes and no dependency depends
      # on, so that a release does not empty the cache.
      - id: rust
        shell: bash
        run: |
          cargo --version
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
          echo "dependencies=$(awk '/^name = "hgl_/ { own = 1 } own && /^version = / { own = 0; next } { print }' Cargo.lock | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      # The downloaded crates and the built dependencies a run on main
      # saved for this system, toolchain and Cargo.lock's dependencies.
      # With them a run compiles only the workspace's own crates.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # `&cache-paths` names this list; the save step below reuses it
          # as `*cache-paths`, so the two cannot drift apart.
          path: &cache-paths |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.version }}-${{ steps.rust.outputs.dependencies }}
      # The dependencies are built with optimisation, which makes the
      # tests about 2.5 times quicker. The workspace's own crates stay
      # unoptimised, as the stack-size tests assume, and debug assertions
      # and overflow checks stay on in all of them. Cargo.toml says so.
      - run: cargo test --workspace --locked
      - name: Test the documentation site in Chrome
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- crates/hgl_doc vendor scripts/check-doc-browser.mjs)
          if [[ -z "$changed" ]]; then
            exit 0
          fi
          doc_site=$(mktemp -d "$RUNNER_TEMP/hgl-doc-site.XXXXXX")
          target/debug/hgl doc crates/hgl_cli/tests/fixtures/doc_html/source --out "$doc_site"
          node scripts/check-doc-browser.mjs "$doc_site"
      # The next two steps run only on main, and only when the cache has
      # no entry for this key yet. Pull requests restore what main saved
      # and save nothing, so the repository's 10 GB of cache holds one
      # entry for each system and Cargo.lock in use.
      #
      # Leaves the workspace's own crates out of the cache: every run
      # rebuilds them.
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      # Saves the downloaded crates and the built dependencies.
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}

  cpp:
    # libhglrt, the C++ target's runtime library (runtime/cpp), built
    # against hgraph's C++ SDK and its unit tests run, and the C++ target
    # on the SDK: the tests that build and run what it writes, and core's
    # cases. All of it plain and again under the address and
    # undefined-behaviour sanitizers (docs/architecture.md, "The C++
    # runtime library"). Ubuntu 26.04's image has GCC 15, which the SDK
    # needs.
    #
    # The work is split four ways, so that it runs side by side on four
    # runners and not one after another on one: each mode, and in each
    # the SDK tests apart from the runtime library's tests and core's
    # cases.
    name: cpp (${{ matrix.mode }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, sanitize]
        part: [sdk, runtime and core]
        include:
          # The sanitized mode: the runtime library's own build option,
          # and the flags `hgl` adds to every compile and link of the
          # generated code and the runtime library it builds.
          - mode: sanitize
            runtime: -DHGLRT_SANITIZE=ON
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined
    runs-on: ubuntu-26.04
    env:
      # The image's GCC 15, for the SDK and for the library.
      CXX: g++-15
      # The dependency prefix and the SDK, which the steps below make or
      # restore, at paths that are the same in every run: a conda prefix
      # holds its own path, and the SDK holds the prefix's.
      HGL_HGRAPH_DEPS: ${{ github.workspace }}/.hgraph/deps
      HGL_HGRAPH_SDK: ${{ github.workspace }}/.hgraph/sdk
      # Empty in the plain mode, which `hgl` reads as no flags.
      HGL_CPP_FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # `hgl`, which the C++ target's steps below build, is built with
        # core's module from the pinned hgl_core submodule.
        with:
          submodules: recursive
      - run: echo "HGRAPH_TAG=$(cat HGRAPH_TAG)" >> "$GITHUB_ENV"
      # What the two are made from: how the SDK is configured (without
      # Arrow), the tag, the script, which names every package of the
      # prefix, and the image they are built on.
      - id: key
        shell: bash
        run: echo "key=hgraph-sdk-noarrow-$ImageOS-$RUNNER_ARCH-$HGRAPH_TAG-${{ hashFiles('scripts/provision-hgraph-sdk.sh', 'scripts/hgraph-dependencies.sh') }}" >> "$GITHUB_OUTPUT"
      # A run with this key restores both and builds neither. A run that
      # builds them saves them, from a pull request too: the key changes
      # only with the tag, the script or the image, and a pull request that
      # changes the script then builds them once and not on each push.
      # The four jobs of a run share the key: where it is new, each
      # builds them and the first to finish saves them.
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .hgraph/deps
            .hgraph/sdk
          key: ${{ steps.key.outputs.key }}
      # micromamba makes the dependency prefix from conda-forge: what hgraph
      # needs without Arrow, fmt, spdlog and simdjson, with CMake and Ninja.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          micromamba-version: "2.10.0-0"
      - if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/provision-hgraph-sdk.sh "$HGRAPH_TAG" "$HGL_HGRAPH_SDK"
      # The prefix's CMake and Ninja for what follows.
      - run: echo "$HGL_HGRAPH_DEPS/bin" >> "$GITHUB_PATH"
      # The runtime library and its unit tests, in this mode.
      - if: matrix.part == 'runtime and core'
        run: cmake -S runtime/cpp -B build/cpp-${{ matrix.mode }} -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.runtime }}
      - if: matrix.part == 'runtime and core'
        run: cmake --build build/cpp-${{ matrix.mode }}
      - if: matrix.part == 'runtime and core'
        run: ctest --test-dir build/cpp-${{ matrix.mode }} --output-on-failure
      - run: cargo --version
      # The C++ target on the SDK: the tests that build and run what it
      # writes. Cases share the runner's native build job budget.
      - if: matrix.part == 'sdk'
        run: |
          jobs=$(nproc)
          cases=$((jobs < 8 ? jobs : 8))
          scripts/check-cpp-sdk.sh "$jobs" "$cases"
      # Core's cases, held to the list of those it does not run yet
      # (crates/hgl_cpp/ci/unsupported_cases.toml) by check_core.py, whose
      # own tests run first, once.
      - if: matrix.part == 'runtime and core' && matrix.mode == 'plain'
        run: python3 -m unittest discover -s crates/hgl_cpp/ci
      - if: matrix.part == 'runtime and core'
        run: cargo build --locked --bin hgl
      - if: matrix.part == 'runtime and core'
        run: python3 crates/hgl_cpp/ci/check_core.py target/debug/hgl spec/hgl_core
