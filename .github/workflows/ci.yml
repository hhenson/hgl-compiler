name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # `hgl` is built with core's module from the pinned hgl_core
      # submodule, so the build needs the submodules too.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # rust-toolchain.toml selects the compiler; rustup installs it on the
      # first cargo command.
      - run: cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # Source files come from all three platforms, so the tests run on all
    # three. Git on the Windows runner checks text files out with CRLF.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The corpus test reads HGL from the pinned specification submodules.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: cargo --version
      - run: cargo test --workspace --locked

  hgraph:
    # The tests that run a generated program on hgraph, which the jobs
    # above leave out, and the pinned core's conformance cases. hgraph
    # has a wheel for Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The hgraph the target is written against (docs/architecture.md).
      - run: python -m pip install hgraph==0.9.1
      - run: echo "HGL_HGRAPH_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - run: cargo --version
      - run: cargo test -p hgl_hgraph -p hgl_cli --locked -- --ignored
      - run: >
          cargo run --locked -- test spec/hgl_core/tests/conformance
          --target hgraph --python "$HGL_HGRAPH_PYTHON"
