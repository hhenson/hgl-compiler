name: Release bundles

on:
  push:
    branches: [main]
    # A release's tag is its bare version, `0.1.0`.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: '26.0'

jobs:
  reuse-build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.find.outputs.version }}
      commit: ${{ steps.find.outputs.commit }}
      run-id: ${{ steps.find.outputs.run-id }}
      artifact-id: ${{ steps.find.outputs.artifact-id }}
      linux-artifact-id: ${{ steps.find.outputs.linux-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo run --locked --quiet -p hgl_build_tool -- version)
          commit=$(git rev-parse HEAD)
          printf 'version=%s\ncommit=%s\n' "$version" "$commit" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF_TYPE == tag ]]; then
            cargo run --locked --quiet -p hgl_build_tool -- find-verified-run \
              "$GITHUB_REPOSITORY" "$commit" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    needs: reuse-build
    if: needs.reuse-build.outputs.artifact-id == ''
    runs-on: ${{ fromJSON(vars.HGL_SELF_HOSTED_MACOS == 'true' && '["self-hosted","macOS","ARM64","hgl-release"]' || '["macos-26"]') }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env: &release-macos-env
      CXX: /usr/bin/clang++
    steps:
      - name: Report the macOS toolchain
        run: &report-toolchain |
          for path in "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "${TMPDIR:-}" "${RUNNER_TOOL_CACHE:-}"; do
            if [[ -d $path ]]; then
              printf '::add-mask::%s\n' "$path" "$(cd -- "$path" && pwd -P)"
            fi
          done
          printf 'DEVELOPER_DIR=%s\nSDKROOT=%s\nCC=%s\nCXX=%s\n' \
            "${DEVELOPER_DIR-<unset>}" "${SDKROOT-<unset>}" "${CC-<unset>}" "${CXX-<unset>}"
          printf 'xcode-select -p: '
          /usr/bin/xcode-select -p 2>/dev/null || printf '%s\n' '<unavailable>'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Locate the Rust caches
        env:
          TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          {
            echo "CARGO_HOME=$TOOL_CACHE/hgl-release-cargo"
            echo "CARGO_TARGET_DIR=$TOOL_CACHE/hgl-release-target"
            echo "RUSTUP_HOME=$TOOL_CACHE/hgl-release-rustup"
          } >> "$GITHUB_ENV"
      - name: Cache Rust crates and builds
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
          key: hgl-macos-arm64-rust-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/package-release.sh') }}
      - name: Locate the native release cache
        id: caches
        env:
          TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          native_key=$(cargo run --locked --quiet -p hgl_build_tool -- native-key)
          echo "native-key=$native_key" >> "$GITHUB_OUTPUT"
          echo "HGL_RELEASE_NATIVE_CACHE=$TOOL_CACHE/hgl-release-native/$native_key" >> "$GITHUB_ENV"
      - name: Cache the native SDK and libraries
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HGL_RELEASE_NATIVE_CACHE }}
          key: hgl-macos-arm64-native-${{ steps.caches.outputs.native-key }}
      - env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/package-release.sh target/release-bundles "$RELEASE_TAG"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Another attempt of the same run uploads an independent artifact.
          name: hgl-macos-arm64-${{ github.run_attempt }}
          path: |
            target/release-bundles/hgl-${{ needs.reuse-build.outputs.version }}-macos-arm64.tar.gz
            target/release-bundles/hgl-${{ needs.reuse-build.outputs.version }}-macos-arm64.tar.gz.sha256
            target/release-bundles/hgl-debug-${{ needs.reuse-build.outputs.version }}-macos-arm64.tar.gz
            target/release-bundles/hgl-debug-${{ needs.reuse-build.outputs.version }}-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: bundle
    runs-on: ${{ fromJSON(vars.HGL_SELF_HOSTED_MACOS == 'true' && '["self-hosted","macOS","ARM64","hgl-release"]' || '["macos-26"]') }}
    env: *release-macos-env
    steps:
      - name: Report the macOS toolchain
        run: *report-toolchain
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact-id }}
          path: ${{ runner.temp }}/artifact
      - shell: bash
        run: |
          version=$(cargo run --locked --quiet -p hgl_build_tool -- version)
          name=hgl-$version-macos-arm64
          scratch=$(mktemp -d "$RUNNER_TEMP/hgl-verify.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          extracted="$scratch/unpacked release"
          mkdir -p "$extracted"
          (
            cd "$RUNNER_TEMP/artifact"
            shasum -a 256 -c "$name.tar.gz.sha256"
            tar -xzf "$name.tar.gz" -C "$extracted"
          )
          bundle="$extracted/$name"
          cargo run --locked --quiet -p hgl_build_tool -- verify "$bundle"
          ln -s "$bundle/bin/hgl" "$extracted/hgl"
          unset HGL_HGRAPH_SDK HGL_HGRAPH_DEPS HGL_CPP_FLAGS DYLD_LIBRARY_PATH
          export HGL_NATIVE_CACHE="$scratch/native"
          hgl="$extracted/hgl"
          test "$("$hgl" --version)" = "hgl $version (hgraph $(cat HGRAPH_TAG))"
          fixtures=crates/hgl_cpp/tests/fixtures
          "$hgl" check "$fixtures/demo.apps.hgl"
          tests=$("$hgl" test "$fixtures/demo.apps.hgl" --target cpp)
          printf '%s\n' "$tests"
          grep -x 'executable cases: 1 passed, 0 failed, 0 not run' <<<"$tests"
          app=$("$hgl" run "$fixtures/demo.apps.hgl" "$fixtures/demo.apps.backtest.hgl")
          printf '%s\n' "$app"
          grep -x 'ran demo.apps.backtest on cpp: 2 publications' <<<"$app"

  hosted-check:
    needs: bundle
    runs-on: macos-26
    env: *release-macos-env
    steps:
      - name: Report the macOS toolchain
        run: *report-toolchain
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact-id }}
      - shell: bash
        run: |
          version=$(cargo run --locked --quiet -p hgl_build_tool -- version)
          name=hgl-$version-macos-arm64
          shasum -a 256 -c "$name.tar.gz.sha256"
          tar -xzf "$name.tar.gz"
          hgl="$name/bin/hgl"
          test "$("$hgl" --version)" = "hgl $version (hgraph $(cat HGRAPH_TAG))"
          "$hgl" check crates/hgl_cpp/tests/fixtures/demo.apps.hgl

  # The hgl-debug archive as a user has it: unpacked into the release, a debug
  # build links its libraries, and lldb finds the lines of the engine's
  # frames in them and in the release's libraries (scripts/check-debug-release.sh).
  verify-debug:
    needs: bundle
    runs-on: ${{ fromJSON(vars.HGL_SELF_HOSTED_MACOS == 'true' && '["self-hosted","macOS","ARM64","hgl-release"]' || '["macos-26"]') }}
    # lldb waits on an authorisation prompt where the machine does not let
    # its account debug (docs/releases.md): the job ends, not the runner.
    timeout-minutes: 30
    env: *release-macos-env
    steps:
      - name: Report the macOS toolchain
        run: *report-toolchain
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact-id }}
          path: ${{ runner.temp }}/artifact
      - shell: bash
        run: scripts/check-debug-release.sh "$RUNNER_TEMP/artifact"

  # Keep the full deployment-target suite behind release packaging and verification.
  cpp-macos:
    needs: [verify, verify-debug]
    if: >-
      !cancelled() &&
      github.repository == 'hhenson/hgl-compiler' &&
      vars.HGL_SELF_HOSTED_MACOS == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch')
      )
    runs-on: [self-hosted, macOS, ARM64, hgl-release]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '8'
      HGL_BUILD_JOBS: '12'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      MICROMAMBA_VERSION: 2.10.0-0
    steps:
      - name: Isolate the job and mask paths
        run: |
          for path in "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" \
              "${TMPDIR:-}" "${DEVELOPER_DIR:-}" "${SDKROOT:-}"; do
            if [[ -d $path ]]; then
              printf '::add-mask::%s\n' "$(cd -- "$path" && pwd -P)"
            fi
          done
          state="$RUNNER_TOOL_CACHE/hgl-cpp-macos"
          {
            echo "CARGO_HOME=$state/cargo"
            echo "RUSTUP_HOME=$state/rustup"
          } >> "$GITHUB_ENV"
          if [[ -x $HOME/.cargo/bin/cargo ]]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select the pinned SDK and runner toolchain
        id: sdk
        run: |
          workspace=$(pwd -P)
          cxx=$(command -v "${CXX:-clang++}")
          cc=$(command -v "${CC:-clang}")
          sdk_root=${SDKROOT:-$(xcrun --sdk macosx --show-sdk-path)}
          sdk_root=$(cd -- "$sdk_root" && pwd -P)
          printf '::add-mask::%s\n' "$sdk_root"
          tag=$(cat HGRAPH_TAG)
          mkdir -p "$workspace/target/cpp-macos/tmp"
          # The prefixes contain absolute paths. Include the workspace
          # and actual SDK and compiler so a cache can be used as built.
          fingerprint=$(
            {
              printf '%s\n' "$workspace" "$cxx" "$cc" "$sdk_root" "$MACOSX_DEPLOYMENT_TARGET"
              sw_vers -buildVersion
              "$cxx" --version
              "$cc" --version
              if [[ -f $sdk_root/SDKSettings.plist ]]; then
                shasum -a 256 < "$sdk_root/SDKSettings.plist"
              fi
            } | shasum -a 256 | cut -d ' ' -f 1
          )
          {
            printf 'tag=%s\n' "$tag"
            printf 'toolchain=%s\n' "$fingerprint"
          } >> "$GITHUB_OUTPUT"
          {
            echo "HGRAPH_TAG=$tag"
            echo "CXX=$cxx"
            echo "CC=$cc"
            echo "SDKROOT=$sdk_root"
            echo "HGL_HGRAPH_DEPS=$workspace/target/cpp-macos/deps"
            echo "HGL_HGRAPH_SDK=$workspace/target/cpp-macos/sdk"
            echo "HGL_NATIVE_CACHE=$workspace/target/cpp-macos/native-plain"
            echo "CARGO_TARGET_DIR=$workspace/target"
            echo "TMPDIR=$workspace/target/cpp-macos/tmp"
            # Use the pinned SDK and plain mode unless a step selects sanitizers.
            echo 'HGL_HGRAPH_SOURCE='
            echo 'HGL_HGRAPH_INSTALL_RPATH='
            echo 'HGL_CPP_FLAGS='
            echo 'DYLD_LIBRARY_PATH='
            echo 'DYLD_FALLBACK_LIBRARY_PATH='
          } >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cpp-macos/deps
            target/cpp-macos/sdk
          key: hgraph-sdk-noarrow-macos-${{ runner.arch }}-${{ steps.sdk.outputs.tag }}-${{ steps.sdk.outputs.toolchain }}-${{ env.MICROMAMBA_VERSION }}-${{ hashFiles('scripts/provision-hgraph-sdk.sh', 'scripts/hgraph-dependencies.sh') }}

      - name: Provision or verify the SDK
        run: |
          if [[ ! -d $HGL_HGRAPH_DEPS ]]; then
            # Install only the package manager binary. The provisioner
            # gives it a temporary home and stores packages in the job prefix.
            mamba="$GITHUB_WORKSPACE/target/cpp-macos/micromamba"
            curl --fail --silent --show-error --location \
              "https://github.com/mamba-org/micromamba-releases/releases/download/$MICROMAMBA_VERSION/micromamba-osx-arm64" \
              --output "$mamba"
            printf '%s  %s\n' c547639f5caf742236641c362746abb4a3505774753ecd08fe341643670c4c01 "$mamba" |
              shasum -a 256 -c -
            chmod +x "$mamba"
            export MAMBA_EXE="$mamba"
          fi
          scripts/provision-hgraph-sdk.sh "$HGRAPH_TAG" "$HGL_HGRAPH_SDK"
          echo "$HGL_HGRAPH_DEPS/bin" >> "$GITHUB_PATH"

      - name: Run the Rust workspace tests
        run: cargo test --workspace --locked --config "profile.dev.package.'*'.opt-level=3"

      - name: Run the C++ runtime tests
        run: |
          cmake -S runtime/cpp -B target/cpp-macos/runtime-plain -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build target/cpp-macos/runtime-plain
          ctest --test-dir target/cpp-macos/runtime-plain --output-on-failure

      - name: Run the C++ runtime tests with sanitizers
        run: |
          cmake -S runtime/cpp -B target/cpp-macos/runtime-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DHGLRT_SANITIZE=ON
          cmake --build target/cpp-macos/runtime-sanitize
          ctest --test-dir target/cpp-macos/runtime-sanitize --output-on-failure

      - name: Run the SDK and pinned core checks
        run: |
          cargo test -p hgl_cli --locked --config "profile.dev.package.'*'.opt-level=3" --test cpp \
            -- --ignored --test-threads=4
          cargo build --locked --config "profile.dev.package.'*'.opt-level=3" --bin hgl
          cargo run --locked --quiet -p hgl_build_tool -- check-core target/debug/hgl spec/hgl_core

      - name: Run the SDK and pinned core checks with sanitizers
        env:
          HGL_CPP_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined
          HGL_NATIVE_CACHE: ${{ github.workspace }}/target/cpp-macos/native-sanitize
        run: |
          cargo test -p hgl_cli --locked --config "profile.dev.package.'*'.opt-level=3" --test cpp \
            -- --ignored --test-threads=4
          cargo run --locked --quiet -p hgl_build_tool -- check-core target/debug/hgl spec/hgl_core

  bundle-linux:
    needs: reuse-build
    if: needs.reuse-build.outputs.linux-artifact-id == ''
    runs-on: ubuntu-26.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &linux-tools
        name: Install the Ubuntu C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++-15 cmake ninja-build
      - name: Locate the Linux native release cache
        id: caches
        run: |
          native_key=$(cargo run --locked --quiet -p hgl_build_tool -- native-key --target x86_64-unknown-linux-gnu)
          echo "native-key=$native_key" >> "$GITHUB_OUTPUT"
          echo "HGL_RELEASE_NATIVE_CACHE=$RUNNER_TEMP/hgl-release-native/$native_key" >> "$GITHUB_ENV"
      - name: Cache the native SDK and libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HGL_RELEASE_NATIVE_CACHE }}
          key: hgl-linux-x86_64-native-${{ steps.caches.outputs.native-key }}
      - env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/package-release.sh target/release-bundles "$RELEASE_TAG"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hgl-linux-x86_64-${{ github.run_attempt }}
          path: |
            target/release-bundles/hgl-${{ needs.reuse-build.outputs.version }}-linux-x86_64.tar.gz
            target/release-bundles/hgl-${{ needs.reuse-build.outputs.version }}-linux-x86_64.tar.gz.sha256
            target/release-bundles/hgl-debug-${{ needs.reuse-build.outputs.version }}-linux-x86_64.tar.gz
            target/release-bundles/hgl-debug-${{ needs.reuse-build.outputs.version }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  verify-linux:
    needs: bundle-linux
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *linux-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bundle-linux.outputs.artifact-id }}
          path: ${{ runner.temp }}/artifact
      - shell: bash
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.43'
          version=$(cargo run --locked --quiet -p hgl_build_tool -- version)
          name=hgl-$version-linux-x86_64
          scratch=$(mktemp -d "$RUNNER_TEMP/hgl-verify.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          extracted="$scratch/unpacked release"
          mkdir -p "$extracted"
          (
            cd "$RUNNER_TEMP/artifact"
            sha256sum -c "$name.tar.gz.sha256"
            tar -xzf "$name.tar.gz" -C "$extracted"
          )
          bundle="$extracted/$name"
          cargo run --locked --quiet -p hgl_build_tool -- verify --target x86_64-unknown-linux-gnu "$bundle"
          ln -s "$bundle/bin/hgl" "$extracted/hgl"
          unset HGL_HGRAPH_SDK HGL_HGRAPH_DEPS HGL_CPP_FLAGS LD_LIBRARY_PATH
          export CXX=/usr/bin/g++-15 HGL_NATIVE_CACHE="$scratch/native"
          hgl="$extracted/hgl"
          test "$("$hgl" --version)" = "hgl $version (hgraph $(cat HGRAPH_TAG))"
          fixtures=crates/hgl_cpp/tests/fixtures
          "$hgl" check "$fixtures/demo.apps.hgl"
          tests=$("$hgl" test "$fixtures/demo.apps.hgl" --target cpp)
          printf '%s\n' "$tests"
          grep -x 'executable cases: 1 passed, 0 failed, 0 not run' <<<"$tests"
          app=$("$hgl" run "$fixtures/demo.apps.hgl" "$fixtures/demo.apps.backtest.hgl")
          printf '%s\n' "$app"
          grep -x 'ran demo.apps.backtest on cpp: 2 publications' <<<"$app"

  # As verify-debug, on Linux with gdb, which also reads a core file.
  verify-debug-linux:
    needs: bundle-linux
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Ubuntu C++ tools and gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++-15 cmake ninja-build gdb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bundle-linux.outputs.artifact-id }}
          path: ${{ runner.temp }}/artifact
      - shell: bash
        env:
          CXX: /usr/bin/g++-15
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.43'
          scripts/check-debug-release.sh "$RUNNER_TEMP/artifact"

  publish:
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.reuse-build.result == 'success' &&
      (
        (needs.reuse-build.outputs.artifact-id != '' && needs.reuse-build.outputs.linux-artifact-id != '') ||
        (
          needs.verify.result == 'success' && needs.hosted-check.result == 'success' &&
          needs.verify-linux.result == 'success' &&
          needs.verify-debug.result == 'success' && needs.verify-debug-linux.result == 'success'
        )
      )
    needs: [reuse-build, bundle, verify, hosted-check, verify-debug, bundle-linux, verify-linux, verify-debug-linux]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: >-
            ${{ needs.reuse-build.outputs.artifact-id || needs.bundle.outputs.artifact-id }},${{ needs.reuse-build.outputs.linux-artifact-id || needs.bundle-linux.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.reuse-build.outputs.run-id || github.run_id }}
          path: ${{ runner.temp }}/artifact
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.reuse-build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.reuse-build.outputs.commit }}
        run: |
          cd "$RUNNER_TEMP/artifact"
          macos=hgl-$RELEASE_VERSION-macos-arm64.tar.gz
          linux=hgl-$RELEASE_VERSION-linux-x86_64.tar.gz
          macos_debug=hgl-debug-$RELEASE_VERSION-macos-arm64.tar.gz
          linux_debug=hgl-debug-$RELEASE_VERSION-linux-x86_64.tar.gz
          sha256sum -c "$macos.sha256" "$linux.sha256" "$macos_debug.sha256" "$linux_debug.sha256"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" != "$RELEASE_COMMIT" ]]; then
            echo "Tag $RELEASE_TAG no longer points to the verified commit" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            "$macos" "$macos.sha256" "$linux" "$linux.sha256" \
            "$macos_debug" "$macos_debug.sha256" "$linux_debug" "$linux_debug.sha256"
