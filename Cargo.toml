# The workspace: one crate per compiler stage, plus shared support crates.
# docs/architecture.md describes how they fit together.

[workspace]
resolver = "3"
members = ["crates/*"]

# Values each crate inherits with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
# No `rust-version` (minimum supported Rust): the project follows the
# current stable release, pinned in rust-toolchain.toml.
license = "MIT"
publish = false
repository = "https://github.com/hhenson/hgl-compiler"

# One place for dependency versions. A crate opts in with
# `name.workspace = true`.
[workspace.dependencies]
hgl_source = { path = "crates/hgl_source" }
hgl_diagnostics = { path = "crates/hgl_diagnostics" }
hgl_lexer = { path = "crates/hgl_lexer" }
hgl_parser = { path = "crates/hgl_parser" }
hgl_analyser = { path = "crates/hgl_analyser" }
clap = { version = "4.6", features = ["derive"] }
codespan-reporting = "0.13"
# Only the graph type and the algorithms over it are used.
petgraph = { version = "0.8", default-features = false, features = ["std"] }
rowan = "0.17"
walkdir = "2.5"

# Lints every crate inherits with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
# Every public item needs a doc comment (see AGENTS.md).
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
